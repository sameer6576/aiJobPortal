spring:
  application:
    name: job-portal-ai-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

gemini:
  api:
    key: test-key-not-used-in-tests
    model: gemini-3.5-flash-lite
    max-output-tokens: 2048
    temperature: 0.7
