server:
  port: 8888

spring:
  application:
    name: job-portal-config-server

  cloud:
    config:
      server:
        git:
          uri: "https://github.com/sameer6576/aiJobPortal-test"
          clone-on-start: true
          default-label: main

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true