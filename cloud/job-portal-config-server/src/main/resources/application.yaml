server:
  port: 8888

spring:
  application:
    name: job-portal-config-server
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPOSITORY_PATH:file:../../job-portal-config,file:./job-portal-config,file:./job-portal-system/job-portal-config}

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true